name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} · Python ${{ matrix.python }}${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    # Run every command in the checkout, wherever the matrix puts it.
    defaults:
      run:
        working-directory: ${{ matrix.checkout-path }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
            checkout-path: .
          - os: macos-latest
            python: "3.11"
            checkout-path: .
          - os: windows-latest
            python: "3.11"
            checkout-path: .
          # The Hermes managed runtime is Python 3.14; one job proves it there.
          - os: ubuntu-latest
            python: "3.14"
            checkout-path: .
          # Regression guard: the suite must pass when the checkout folder is
          # not named `rookery` (docs/ship/PUBLISH.md step 2 clones it under a
          # different name).
          - os: ubuntu-latest
            python: "3.11"
            checkout-path: plugin-under-test
            label: " · checkout: plugin-under-test"
    steps:
      - uses: actions/checkout@v4
        with:
          path: ${{ matrix.checkout-path }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install . pytest "fastapi==0.133.1" "httpx==0.28.1"
      # The byte-exact render tests are keyed to the renderer environments they
      # were recorded in (tests/engine/test_flock_synth.py). Pin CI to those.
      - name: Pin the tested renderer environment
        shell: bash
        run: |
          if [ "${{ matrix.python }}" = "3.14" ]; then np=2.5.4; sp=1.18.1; else np=2.4.3; sp=1.17.1; fi
          python -m pip install "numpy==$np" "scipy==$sp" "pedalboard==0.9.26" "soundfile==0.14.0" "pyloudnorm==0.2.0"
      - name: Tests
        run: python -m pytest tests/engine tests/acceptance -q -p no:cacheprovider
      - name: Catalog audit
        run: python tools/audit.py
