name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} · Python ${{ matrix.python }}${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    # Run every command in the checkout, wherever the matrix puts it.
    defaults:
      run:
        working-directory: ${{ matrix.checkout-path }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
            checkout-path: .
          - os: macos-latest
            python: "3.11"
            checkout-path: .
          - os: windows-latest
            python: "3.11"
            checkout-path: .
          # The Hermes managed runtime is Python 3.14; one job proves it there.
          - os: ubuntu-latest
            python: "3.14"
            checkout-path: .
          # Regression guard: the suite must pass when the checkout folder is
          # not named `rookery` (docs/ship/PUBLISH.md step 2 clones it under a
          # different name).
          - os: ubuntu-latest
            python: "3.11"
            checkout-path: plugin-under-test
            label: " · checkout: plugin-under-test"
    steps:
      - uses: actions/checkout@v4
        with:
          path: ${{ matrix.checkout-path }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install . pytest
      - name: Tests
        run: python -m pytest tests/engine tests/acceptance -q -p no:cacheprovider
      - name: Catalog audit
        run: python tools/audit.py
