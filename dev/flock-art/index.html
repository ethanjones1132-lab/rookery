<!doctype html>
<!-- The Flock: bird art rig sheet. Dev only. Loads the installed Hermes Desktop
     stylesheet and theme seeds, same as dev/preview, so the birds are judged in
     the real theme. -->
<html lang="en" class="dark" data-hermes-mode="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Flock Rig Sheet</title>
<link rel="icon" href="data:," />
<style>
  :root {
    color-scheme: dark;
    --theme-foreground: #e6edf3; --theme-primary: #4a84fe; --theme-secondary: #1d2e4f;
    --theme-accent-soft: #17243a; --theme-midground: #4a84fe; --theme-warm: #4a84fe;
    --theme-background-seed: #0d1117; --theme-sidebar-seed: #010409; --theme-card-seed: #010409;
    --theme-elevated-seed: #161b22; --theme-bubble-seed: #07162c;
    --theme-mix-chrome: 74%; --theme-mix-sidebar: 100%; --theme-mix-card: 38%;
    --theme-mix-elevated: 46%; --theme-mix-bubble: 46%;
    --dt-border: #30363d; --dt-input: #0d1117; --dt-ring: #4a84fe; --dt-muted: #1a1e24;
    --dt-primary-foreground: #161616; --dt-destructive: #f85149; --ui-success: #2fb38a;
    --dt-font-sans: ui-sans-serif, system-ui, "Segoe UI", sans-serif;
    --dt-font-mono: ui-monospace, "Cascadia Mono", Consolas, monospace;
  }
  html, body, #app { margin: 0; min-height: 100%; }
  body { background: var(--ui-bg-editor, #0d1117); color: var(--ui-text-primary, #e6edf3); font-family: var(--dt-font-sans); font-size: 13px; }
  html.light { color-scheme: light; }
</style>
<script type="importmap">
{ "imports": {
  "react": "https://esm.sh/react@19.3.0",
  "react-dom/client": "https://esm.sh/react-dom@19.3.0/client?deps=react@19.3.0"
} }
</script>
</head>
<body>
<div id="app"></div>
<script type="module">
  const sheets = await fetch('/hermes/styles.json').then(r => r.json()).catch(() => [])
  for (const name of sheets) { const l = document.createElement('link'); l.rel = 'stylesheet'; l.href = '/hermes/assets/' + name; document.head.prepend(l) }
  try { new EventSource('/__reload').onmessage = () => location.reload() } catch {}
  await import('/dev/flock-art/sheet.js')
</script>
</body>
</html>
